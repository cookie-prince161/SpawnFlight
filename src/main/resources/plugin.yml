name: SpawnFlight
version: 1.1.0
main: com.elias.spawnflight.SpawnFlight
api-version: '26.1'
description: Flugzone mit Gleiten ohne Elytra und Boost per F-Taste.

commands:
  elytrazone:
    description: Elytra-Zone verwalten und ein- oder ausschalten
    usage: /elytrazone <enable|disable|pos1|pos2|info|remove|boost|boosts|cooldown|duration>
    permission: spawnflight.admin

permissions:
  spawnflight.admin:
    default: op
